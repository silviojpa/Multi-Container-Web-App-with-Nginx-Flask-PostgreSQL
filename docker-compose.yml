version: '3.8'

services:
  # ---------------------------------------------------------
  # APLICAÇÃO E INFRAESTRUTURA WEB
  # ---------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-app
    networks:
      - lab-net

  web-app:
    build: .
    container_name: flask_web_app
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=usuarios_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - lab-net

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lab-net

  # ---------------------------------------------------------
  # STACK DE OBSERVABILIDADE & MONITORAMENTO
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    networks:
      - lab-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor_metrics
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - lab-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # STACK DE QUALIDADE DE CÓDIGO (SONARQUBE)
  # ---------------------------------------------------------
  sonar-db:
    image: postgres:15
    container_name: sonars_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpassword
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - lab-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube_server
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonarpassword
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - lab-net
    restart: unless-stopped

# ---------------------------------------------------------
# REDES E VOLUMES PERSISTENTES
# ---------------------------------------------------------
networks:
  lab-net:
    driver: bridge

volumes:
  pgdata:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: